<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greeting Card</title>
    <style>
      .container {
        width: 400px;
        height: 250px;
        margin: 100px auto;
        perspective: 800px;
      }
      .card {
        width: 400px;
        height: 250px;
        position: relative;
        background: pink;
      }
      .message {
        width: 100%;
        height: 100%;

        background: lightyellow;

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 30px;
      }
      .gate {
        position: absolute;

        top: 0;

        width: 50%;
        height: 100%;

        background: pink;

        transition: 1s;

        transform-style: preserve-3d;
        border:1px solid black;
      }
      .left {
        left: 0;

        transform-origin: left;
      }

      .right {
        right: 0;

        transform-origin: right;
      }
      .card:hover .left {
        transform: rotateY(120deg);
      }

      .card:hover .right {
        transform: rotateY(120deg);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="message">🎉🎉Happy birthday🎉🎉</div>

        <div class="gate left"></div>
        <div class="gate right"></div>
      </div>
    </div>
  </body>
</html>
