<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwindcss</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <h1 class="text-xl text-red-600 text-center m-4 border border-black">
      this is a heading inside tailwind css
    </h1>
    <p
      class="bg-red-600 text-2xl text-center text-gray-800 font-bold leading-relaxed"
    >
      this is red colored paragraph
    </p>
    <p class="bg-green-500 pl-4">this is a paragraph with some padding</p>
    <!-- <div class="relative m-5 left-5 top-10">
      this is a content with position relative
      <div class="absolute top-4 left-12">this is absolute position</div>
    </div> -->
    <div class="w-1/2 bg-orange-600 m-5 p-5">this is a paragraph w-1/2 </div>
    <div class="flex gap-4 justify-center items-center m-5 p-5 min-h-screen bg-gray-100 flex-col md:flex-row">
        <div class="border border-black p-4 flex-1">one</div>
        <div class="border border-black p-4 flex-1">two</div>
        <div class="border border-black p-4 flex-1">three</div>
        <div class="border border-black p-4 flex-1">four</div>
    </div>
   <div class="grid grid-cols-3 gap-4 m-5 p-5 min-h-screen bg-gray-400">
            <div class="border border-4 gap-4 bg-green-400 text-2xl text-center font-bold">one</div>
            <div class="border border-4 gap-4 bg-blue-400 text-2xl text-center font-bold">two</div>
            <div class="border border-4 gap-4 bg-yellow-400 text-2xl text-center font-bold">three</div>
            <div class="border border-4 gap-4 bg-red-400 text-2xl text-center font-bold">four</div>
            <div class="border border-4 gap-4 bg-purple-400 text-2xl text-center font-bold">five</div>
            <div class="border border-4 gap-4 bg-pink-400 text-2xl text-center font-bold">six</div>
  </body>
</html>
