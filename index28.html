<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex justify-center items-center">
    <main class="w-full max-w-sm bg-white rounded-2xl p-8">
      <img src="profile.png" alt="pic" class="w-24 h-24 rounded-full object-cover object-[20%_30%] border border-blue-400 mx-auto" />
      <h1 class="mt-4 text-2xl font-bold text-center">Rajat Jain</h1>
      <p class="text-blue-600 text-center font-medium">Frontend Developer</p>
      <p class="text-gray-500 text-sm leading-relaxed text-center mt-4">
        I am learning to build beautiful and responsive websites using HTML, CSS
        and Tailwind CSS.
      </p>
      <div class="flex justify-center gap-4 mb-4">
        <span class="bg-orange-100 text-orange-600 py-1 px-3 rounded-full">HTML</span>
        <span class="bg-blue-100 text-blue-600 py-1 px-3 rounded-full">CSS</span>
        <span class="bg-indigo-100 text-indigo-600 py-1 px-3 rounded-full">Tailwind</span>
      </div>
      <details class="mt-2">
        <summary class="list-none cursor-pointer bg-blue-500 rounded-xl px-4 py-2 text-center text-white hover:bg-blue-700">View Profile</summary>
        <p>My goal is to create five responsive projects this semester.</p>
      </details>
    </main>
  </body>
</html>
