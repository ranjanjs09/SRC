<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient</title>
    <style>
        body{
            display:flex;
            justify-content: center;
            align-items: center;
            height:100vh;
        }
        .box{
            border:1px solid black;
            height:200px;   
            width:200px;
            background: conic-gradient(white 0deg 90deg,black 90deg 180deg,white 180deg 270deg,black 270deg 360deg);
            background-size: 50px 50px;
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
