<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        *{
            box-sizing:border-box;
        }
        .first{
            border:5px solid red;
            height:300px;
            width:300px;
            padding:50px 20px 20px 20px;
            margin-bottom:10px ;
            text-align:center;

        }
        .second{
            border:5px solid black;
            height:300px;
            width:300px;
            padding:40px 10px;
            margin-top:50px;
            text-align:center;
         
            padding:20px;
        }
    </style>
</head>
<body>
    <div class="first">
        this is a content inside div element
    </div>
    <div class="second">
        this is content inside div element
    </div>
    
</body>
</html>
