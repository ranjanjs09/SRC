<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            font-size:20px;
            text-align:center;
        }
        body{
            line-height:1;
        }
        h1{
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size:40px;
            font-weight:normal;
            font-weight:600;
            font-style:italic;
            text-align:left;
            text-decoration:underline;
            text-shadow:2px 2px 3px green;

        }
        p{
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size:30px;
            font-weight:800;
            font-style:oblique;
            text-decoration:overline;
            text-shadow:3px 3px 5px red;
        }
        #first{
            font-size:2rem;
            font-weight:900;
            text-align:right;
            text-transform:uppercase;

        }
        div{
            line-height: 2;
            word-spacing:3px;
        }
        div.first{
            font-size:20px;
            letter-spacing:3px;
        }
        div p{
            font-size:2em;
            text-align:left;
            text-decoration:line-through;
            text-transform:capitalize;
        }
    </style>
</head>
<body>
    <h1>this is a heading</h1>
    <p>this is a paragraph</p>
    <p id="first">this is a new paragraph</p>
    <div class="first">
        this is content inside div element
        <p>this is a pragraph inside first class</p>
    </div>
</body>
</html>
