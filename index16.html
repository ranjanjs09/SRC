<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Properties</title>
    <style>
      body {
        width: 100vw;
        height: 100vh;
      }
      .box {
        border: 2px solid black;
      }
      .box1 {
        display: grid;
         width: 100%;
        /* height: 100%;  */
        gap:10px;
        grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
        background-color: beige;
      }

      .box2 {
        display: grid;
        width: 100%;
       
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        background-color: azure;
      }
      /* .center {
        display: flex;
        justify-content: center;
        align-items: center;
      } */
    </style>
  </head>
  <body>
    <div class="box1">
      <div class="box center">HTML</div>
      <div class="box center">CSS</div>
      <div class="box center">REACT</div>
    </div>
    <div class="box2">
      <div class="box center">HTML</div>
      <div class="box center">CSS</div>
      <div class="box center">REACT</div>
    </div>
  </body>
</html>
