<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>
        body{
            /* background-color: rgba(128, 128, 128, 0.228); */
            width:100vw;
            height:100vh;
            display:flex;
            justify-content: center;
            align-items: center;
            background: conic-gradient(white 0deg 90deg,black 90deg 180deg,white 180deg 270deg,black 270deg 360deg);
            background-size: 5px 5px;
        }
        .product{
            background:white;
            border:1px solid rgba(0, 0, 0, 0.486);
            text-align:center;
            overflow:hidden;
          
        }
        /* figure{
            width:100%;
            height:50%;
        } */
        .img{
            width:100%;
            /* object-fit: cover; */
        }
        .product:hover img{
            transform: scale(1.2);
           
        }
    </style>
</head>
<body>
    <div class="product">
        <figure>
            <img src="headphone.png" alt="headphone">
            <figcaption>wireless Blutooth Headphone</figcaption>
        </figure>
        <div class="content">this is very good quality headphone</div>
    </div>
</body>
</html>
