<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid properties</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            height:100vh;
            width:100vw;
        }
        .container{
            background-color: rgb(232, 220, 220);
            width:100%;
            display:grid;
            height:100%;
            row-gap: 10px;
            column-gap:10px;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(4,1fr);
            
        }
        .item{
            background-color: rgb(68, 68, 194);
            border:5px solid black;
            width:100%;
            display:flex;
            justify-content: center;
            align-items: center;
            font-size:1.5rem;
            
           
        }
        .header,.footer{
            grid-column-start: 1;
            grid-column-end:4;
        }
        .sidebar{
            grid-row-start: 2;
            grid-row-end:4;
        }
        .content3{
            grid-column-start:2;
            grid-column-end: 4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item header">header</div>
        <div class="item sidebar">sidebar</div>
        <div class="item">content1</div>
        <div class="item">content2</div>
        <div class="item content3">content3</div>
        <div class="item footer">footer</div>
    </div>
</body>
</html>
