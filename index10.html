<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position property</title>
    <style>
        .container{
            border:2px solid red;
            height:2000px;

        }
        img{
            height:300px;
            width:300px
        }
        .first{
            position:static;
            top:50px;
            left:50px;
        }
        .second{
            position:relative;
            top:50px;
            left:50px;
        }
        .third{
            position:absolute;
            top:100px;
            left:100px;
        }
        .fourth{
            position:fixed;
            top:50px;
            left:50px;
        }
        .fifth{
            position:sticky;
            top:50px;
            left:50px;
        }
        .container2{
            height:1000px;
            width:1000px;
            border:2px solid green;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="image.png" alt="first image" class="first">
        <img src="hawamahal.png" alt="second image"class="second">
        <img src="image2.png" alt="third image"class="third">
        <img src="jalmahal.png" alt="fourth image"class="fourth">
        <img src="image.png" alt="fifth image"class="fifth">
    </div>
    <div class="container2">
        this is content inside container 2
    </div>
</body>
</html>
