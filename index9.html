<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        p:nth-child(2){
            color:crimson;
        }
        p:nth-of-type(2){
            color:blueviolet;
        }
     
    </style>
  </head>
  <body>
   <div>
    <h1>this is heading</h1>
    <p>this is para first</p>
    <span>this is span tag</span>
    <p>this second para</p>
   </div>
  </body>
</html>
